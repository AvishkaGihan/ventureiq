[project]
name = "ventureiq-backend"
version = "0.1.0"
description = "VentureIQ - AI-powered startup idea validation platform backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "langchain-google-genai>=4.2.0",
    "langchain-openrouter>=0.2.3",
    "ddgs>=8.0.0",
    "firebase-admin>=7.4.0",
    "PyJWT[crypto]>=2.12.1",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.30.0",
    "alembic>=1.18.4",
    "redis>=7.4.0",
    "uvicorn[standard]>=0.46.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.12",
]
