# =============================================================================
# VentureIQ Local Development Environment
# =============================================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d redis postgres chromadb  # Start infra only
#   docker compose logs -f            # Follow logs
#   docker compose down               # Stop all services
#   docker compose down -v            # Stop and remove volumes
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # For linux
      - ./backend/app:/app/app:z
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:z
      # - ./backend/app:/app/app
      # - ./backend/firebase-service-account.json:/app/firebase-service-account.json
    environment:
      DATABASE_URL: postgresql+asyncpg://ventureiq:ventureiq@postgres:5432/ventureiq
      REDIS_URL: redis://redis:6379
      CHROMADB_URL: http://chromadb:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ventureiq
      POSTGRES_PASSWORD: ventureiq
      POSTGRES_DB: ventureiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ventureiq" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  chroma_data:
