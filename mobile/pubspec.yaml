name: ventureiq_app
description: 'VentureIQ - AI-powered startup idea validation platform'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.0    # State management — AsyncNotifier patterns
  go_router: ^7.0.0           # Declarative routing, deep linking, ShellRoute
  dio: ^5.9.2                 # HTTP client with interceptors
  google_fonts: ^8.1.0        # Inter + JetBrains Mono typefaces

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
